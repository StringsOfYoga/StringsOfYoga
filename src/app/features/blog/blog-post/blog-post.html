<section class="page-section">
  <div class="container">
    @if (post) {
      <article class="blog-post mx-auto" style="max-width: 720px">
        <p class="blog-post__back">
          <a routerLink="/blog">← Back to blog</a>
        </p>
        <p class="meta-date">{{ post.date | date: 'longDate' }} · {{ post.category }}</p>
        <h1 class="blog-post__title">{{ post.title }}</h1>
        <img [src]="post.image" [alt]="post.title" class="img-fluid rounded-4 mb-4" loading="lazy" />
        @for (para of paragraphs(); track $index) {
          <p>{{ para }}</p>
        }
      </article>
    } @else {
      <p class="empty-state">Article not found. <a routerLink="/blog">Return to blog</a>.</p>
    }
  </div>
</section>
