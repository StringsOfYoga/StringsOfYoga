<app-page-hero
  title="Contact"
  eyebrow="We're here"
  subtitle="Share what you need—booking, questions, or simply hello. We'll respond with warmth and clarity."
/>

<section class="page-section">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-5">
        @if (site) {
          <h2 class="section-title divider">Connect</h2>
          <p>
            <strong>Email</strong><br />
            <a [href]="'mailto:' + site.brand.email">{{ site.brand.email }}</a>
          </p>
          @if (site.brand.phone) {
            <p>
              <strong>Phone</strong><br />
              {{ site.brand.phone }}
            </p>
          }
          <div class="social-links mt-4">
            <ul>
              <li><a href="#" aria-label="Facebook"><i class="icon icon-facebook"></i></a></li>
              <li><a href="#" aria-label="YouTube"><i class="icon icon-youtube-play"></i></a></li>
            </ul>
          </div>
        }
      </div>

      <div class="col-lg-7">
        @if (submitted) {
          <div class="soft-card p-4" role="status">
            <h3>Thank you</h3>
            <p>Your message has been received. We'll be in touch soon—take a slow breath until then.</p>
          </div>
        } @else {
          <form class="contact-form soft-card p-4" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label for="name">Name</label>
              <input id="name" type="text" class="form-control" required [(ngModel)]="form.name" name="name" />
            </div>
            <div class="mb-3">
              <label for="email">Email</label>
              <input id="email" type="email" class="form-control" required [(ngModel)]="form.email" name="email" />
            </div>
            <div class="mb-3">
              <label for="subject">Subject</label>
              <input id="subject" type="text" class="form-control" [(ngModel)]="form.subject" name="subject" />
            </div>
            <div class="mb-3">
              <label for="message">Message</label>
              <textarea
                id="message"
                class="form-control"
                rows="5"
                required
                [(ngModel)]="form.message"
                name="message"
              ></textarea>
            </div>
            @if (error) {
              <div class="alert alert-danger">{{ error }}</div>
            }
            <button type="submit" class="btn btn-common btn-pill" [disabled]="loading">
              {{ loading ? 'Sending...' : 'Send message' }}
            </button>
          </form>
        }
      </div>
    </div>
  </div>
</section>
