<article class="workshop-card soft-card h-100">
  <div class="workshop-card__media" [style.background-image]="'url(' + workshop.coverImage + ')'">
    @if (workshop.featured) {
      <span class="workshop-card__category">Featured</span>
    }
  </div>
  <div class="workshop-card__body">
    <time class="workshop-card__date" [attr.datetime]="workshop.date">
      {{ workshop.date | date: 'mediumDate' }} · {{ workshop.time }}
    </time>
    <h3>{{ workshop.title }}</h3>
    <p>{{ workshop.description }}</p>
    <ul class="workshop-card__meta list-unstyled">
      <li>{{ workshop.location }}</li>
    </ul>
    <a [routerLink]="['/workshops', workshop.id]" class="btn btn-outline-accent btn-pill">
      {{ workshop.ctaText || 'Learn more' }}
    </a>
  </div>
</article>
