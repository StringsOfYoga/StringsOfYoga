<article class="course-card soft-card h-100">
  <div class="course-card__media" [style.background-image]="'url(' + course.image + ')'">
  </div>
  <div class="course-card__body">
    <h3>{{ course.title }}</h3>
    <p class="course-card__meta">{{ course.duration }} · {{ course.level }}</p>
    <p class="course-card__desc">{{ course.description }}</p>
    <p class="course-card__format"><small>{{ course.format }}</small></p>
    <a [routerLink]="['/contact']" [queryParams]="{ interest: course.title }" class="btn btn-accent btn-pill">
      Book session
    </a>
  </div>
</article>
