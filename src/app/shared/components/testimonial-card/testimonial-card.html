<blockquote class="testimonial-card soft-card h-100" data-aos="fade-up">
  <p class="testimonial-card__quote">“{{ testimonial.quote }}”</p>
  <footer class="testimonial-card__author">
    <img [src]="testimonial.image" [alt]="testimonial.name" width="56" height="56" loading="lazy" />
    <div>
      <cite>{{ testimonial.name }}</cite>
      <span>{{ testimonial.role }}</span>
    </div>
  </footer>
</blockquote>
