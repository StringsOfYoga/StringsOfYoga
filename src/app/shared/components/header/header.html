<div id="header-wrap">
  <header id="header">
    <div class="container-fluid">
      <div class="header-bar">
        <div class="header-logo">
          <a routerLink="/"><img src="/assets/images/soy-logo-bw.png" width="100" alt="Strings of Yoga" /></a>
        </div>

        <nav id="navbar" [class.open]="mobileMenuOpen" aria-label="Main navigation">
          <ul class="menu-list">
            @for (item of navItems; track item.path) {
              <li class="menu-item">
                <a
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: item.exact }"
                  (click)="closeMobileMenu()"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </nav>

        <div class="header-cta">
          <a routerLink="/contact" class="btn-header-cta">Inquire</a>
        </div>

        <button type="button" class="mobile-menu-toggle" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu" [attr.aria-expanded]="mobileMenuOpen">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </header>
</div>
