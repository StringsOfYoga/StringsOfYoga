<div id="header-wrap">
  <div class="top-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-6">
          <div class="social-links">
            <ul>
              <li><a href="#" aria-label="Facebook"><i class="icon icon-facebook"></i></a></li>
              <li><a href="#" aria-label="Twitter"><i class="icon icon-twitter"></i></a></li>
              <li><a href="#" aria-label="YouTube"><i class="icon icon-youtube-play"></i></a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <header id="header">
    <div class="container-fluid">
      <div class="header-bar">
        <div class="header-logo">
          <a routerLink="/"><img src="/assets/images/soy-logo-bw.png" width="100" alt="Strings of Yoga logo" /></a>
        </div>

        <button type="button" class="mobile-menu-toggle" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu" [attr.aria-expanded]="mobileMenuOpen">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav id="navbar" [class.open]="mobileMenuOpen" aria-label="Main navigation">
          <ul class="menu-list">
            @for (item of navItems; track item.path) {
              <li class="menu-item">
                <a
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: item.exact }"
                  (click)="closeMobileMenu()"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </nav>
      </div>
    </div>
  </header>
</div>
