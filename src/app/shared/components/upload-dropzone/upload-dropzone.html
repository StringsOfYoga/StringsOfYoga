<div
  class="dropzone-container"
  [class.dragging]="isDragging"
  [class.has-error]="error"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    type="file"
    class="file-input"
    [accept]="accept"
    [multiple]="multiple"
    (change)="onFileSelect($event)"
    id="dropzone-file-{{ allowedTypes.join('-') }}"
  />
  <label class="dropzone-label" for="dropzone-file-{{ allowedTypes.join('-') }}">
    <div class="dropzone-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>
    <p class="dropzone-text">{{ label }}</p>
    <p class="dropzone-hint">
      Supported: {{ allowedTypes.join(', ') }} | Max: {{ detector.formatFileSize(maxFileSize) }}
    </p>
  </label>

  @if (error) {
    <div class="dropzone-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      {{ error }}
    </div>
  }
</div>
