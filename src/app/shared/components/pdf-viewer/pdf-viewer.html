@if (isOpen && pdfUrl) {
  <div class="pdf-viewer__backdrop" (click)="onBackdropClick($event)">
    <div class="pdf-viewer__panel">
      <div class="pdf-viewer__header">
        <h3 class="pdf-viewer__title">{{ title }}</h3>
        <button type="button" class="pdf-viewer__close" (click)="onClose()" aria-label="Close PDF viewer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="pdf-viewer__body">
        <iframe [src]="safePdfUrl" title="{{ title }}" class="pdf-viewer__frame"></iframe>
      </div>
    </div>
  </div>
}
